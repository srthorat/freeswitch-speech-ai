syntax = "proto3";

package google.cloud.speech.v2;

// Google Cloud Speech-to-Text v2 API service
service Speech {
  // Performs bidirectional streaming speech recognition.
  rpc StreamingRecognize(stream StreamingRecognizeRequest) returns (stream StreamingRecognizeResponse);
}

// Top-level message sent by the client for the StreamingRecognize method.
message StreamingRecognizeRequest {
  oneof streaming_request {
    // Provides information to the recognizer that specifies how to process the request.
    StreamingRecognitionConfig streaming_config = 1;
    
    // The audio data to be recognized.
    bytes audio = 2;
  }

  // Must be set in the first `StreamingRecognizeRequest`. Once set, it cannot be changed.
  string recognizer = 3;

  // Alternative audio content field for compatibility.
  bytes audio_content = 4;
}

// Provides configuration information for the StreamingRecognize request.
message StreamingRecognitionConfig {
  // Configuration for the recognition request.
  RecognitionConfig config = 1;

  // Configuration for streaming features.
  StreamingRecognitionFeatures streaming_features = 2;
}

// Configuration for streaming recognition features.
message StreamingRecognitionFeatures {
  // If true, interim results may be returned as they become available.
  bool interim_results = 1;

  // Enable voice activity detection.
  bool enable_voice_activity_events = 2;
}

// Provides information to the Recognizer that specifies how to process the request.
message RecognitionConfig {
  // Audio decoding configuration.
  oneof decoding_config {
    // Automatically detect decoding configuration.
    AutoDetectDecodingConfig auto_decoding_config = 1;
    
    // Explicitly specified decoding configuration.
    ExplicitDecodingConfig explicit_decoding_config = 2;
  }

  // Which model to select for the given request.
  string model = 3;

  // A list of up to 5 language codes.
  repeated string language_codes = 4;

  // Configuration to enable speaker diarization.
  SpeakerDiarizationConfig speaker_diarization_config = 5;

  // Speech recognition features.
  RecognitionFeatures features = 6;

  // Speech adaptation configuration.
  SpeechAdaptation adaptation = 7;
}

// Automatically detect decoding configuration.
message AutoDetectDecodingConfig {
  // No additional configuration needed - the service will automatically detect audio format
}

// Explicitly specified decoding configuration.
message ExplicitDecodingConfig {
  // Audio encoding type.
  enum AudioEncoding {
    AUDIO_ENCODING_UNSPECIFIED = 0;
    LINEAR16 = 1;
    FLAC = 2;
    MULAW = 3;
    AMR = 4;
    AMR_WB = 5;
    OGG_OPUS = 6;
    SPEEX_WITH_HEADER_BYTE = 7;
    WEBM_OPUS = 8;
  }

  // The encoding of the audio data sent in the request.
  AudioEncoding encoding = 1;

  // Sample rate in Hertz of the audio data sent in the request.
  int32 sample_rate_hertz = 2;

  // The number of audio channels in the input audio.
  int32 audio_channel_count = 3;
}

// Configuration to enable speaker diarization.
message SpeakerDiarizationConfig {
  // If true, enables speaker detection for each recognized word.
  bool enable_speaker_diarization = 1;

  // Minimum number of speakers in the conversation.
  int32 min_speaker_count = 2;

  // Maximum number of speakers in the conversation.
  int32 max_speaker_count = 3;
}

// Available recognition features.
message RecognitionFeatures {
  // Multi-channel mode.
  enum MultiChannelMode {
    MULTI_CHANNEL_MODE_UNSPECIFIED = 0;
    SEPARATE_RECOGNITION_PER_CHANNEL = 1;
  }

  // Enable automatic punctuation.
  bool enable_automatic_punctuation = 1;

  // Filter out profanities.
  bool profanity_filter = 2;

  // Enable word time offsets.
  bool enable_word_time_offsets = 3;

  // Enable word confidence.
  bool enable_word_confidence = 4;

  // Enable automatic noise removal.
  bool enable_automatic_denoising = 5;

  // Multi-channel mode.
  MultiChannelMode multi_channel_mode = 6;

  // Speaker diarization configuration.
  SpeakerDiarizationConfig diarization_config = 7;

  // Language detection configuration.
  LanguageDetectionConfig language_detection_config = 8;
}

// Configuration for language detection.
message LanguageDetectionConfig {
  // Enable automatic language detection.
  bool enable_language_detection = 1;
}

// Speech adaptation configuration.
message SpeechAdaptation {
  // A list of phrase sets.
  repeated PhraseSet phrase_sets = 1;
}

// Provides a list of words and phrases "hints" to the speech recognizer.
message PhraseSet {
  // A list of word and phrase "hints".
  repeated Phrase phrases = 1;

  // Hint Boost. Positive value will increase the probability that a specific phrase will be recognized over other similar sounding phrases.
  float boost = 2;
}

// A phrases containing words and phrase "hints".
message Phrase {
  // The phrase itself.
  string value = 1;

  // Hint Boost for this phrase.
  float boost = 2;
}

// StreamingRecognizeResponse is the only message returned to the client by StreamingRecognize.
message StreamingRecognizeResponse {
  // This repeated list contains zero or more results that correspond to consecutive audio segments.
  repeated StreamingRecognitionResult results = 1;

  // Indicates the type of speech event.
  SpeechEventType speech_event_type = 2;

  // Time offset of the end of this speech recognition (in seconds).
  int64 total_billed_time_seconds = 3;

  // Error information if the request failed.
  ResponseError error = 4;
}

// Error information for failed requests.
message ResponseError {
  // Error code.
  int32 code = 1;
  
  // Error message.
  string message = 2;
}

// A speech recognition result corresponding to a portion of the audio.
message StreamingRecognitionResult {
  // May contain one or more recognition hypotheses.
  repeated SpeechRecognitionAlternative alternatives = 1;

  // If false, this StreamingRecognitionResult represents an interim result.
  bool is_final = 2;

  // An estimate of the likelihood that the recognizer will not change its guess about this interim result.
  float stability = 3;

  // Time offset of the end of this result relative to the beginning of the audio (in seconds).
  int64 result_end_time_seconds = 4;

  // For multi-channel audio, this is the channel number corresponding to the recognized result.
  int32 channel_tag = 5;

  // The language tag of the alternative.
  string language_code = 6;
}

// Alternative hypotheses (a.k.a. n-best list).
message SpeechRecognitionAlternative {
  // Transcript text representing the words that the user spoke.
  string transcript = 1;

  // The confidence estimate between 0.0 and 1.0.
  float confidence = 2;

  // A list of word-specific information for each recognized word.
  repeated WordInfo words = 3;
}

// Word-specific information for recognized words.
message WordInfo {
  // Time offset relative to the beginning of audio (in seconds).
  int64 start_time_seconds = 1;

  // Time offset relative to the beginning of audio (in seconds).
  int64 end_time_seconds = 2;

  // The word corresponding to this set of information.
  string word = 3;

  // The confidence estimate between 0.0 and 1.0.
  float confidence = 4;

  // A distinct integer value is assigned for every speaker within the audio.
  int32 speaker_label = 5;
}

// Indicates the type of speech event.
enum SpeechEventType {
  // No speech event specified.
  SPEECH_EVENT_TYPE_UNSPECIFIED = 0;

  // This event indicates that the server has detected the end of the user's speech.
  END_OF_SINGLE_UTTERANCE = 1;

  // This event indicates that the server has detected the beginning of human voice activity.
  SPEECH_ACTIVITY_BEGIN = 2;

  // This event indicates that the server has detected the end of human voice activity.
  SPEECH_ACTIVITY_END = 3;
}