version: '3.8'

services:
  freeswitch-speech-ai:
    image: freeswitch-speech-ai:all-modules
    container_name: freeswitch-speech-ai
    hostname: freeswitch

    # Build configuration (optional - use pre-built image or build locally)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CPUS: 4
        AWS_SDK_CPP_VERSION: 1.11.345
        LIBWEBSOCKETS_VERSION: 4.3.3
        GRPC_VERSION: 1.64.2

    # Network ports
    ports:
      # SIP
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "5080:5080/tcp"
      - "5080:5080/udp"
      # Event Socket (fs_cli)
      - "8021:8021/tcp"
      # RTP media
      - "16384-16484:16384-16484/udp"

    # Environment variables for all transcription services
    environment:
      # Deepgram API Key (for mod_deepgram_transcribe)
      # - DEEPGRAM_API_KEY=your_deepgram_api_key_here

      # AWS Credentials (for mod_aws_transcribe - optional if using IAM roles)
      # - AWS_ACCESS_KEY_ID=your_access_key_here
      # - AWS_SECRET_ACCESS_KEY=your_secret_key_here
      # - AWS_REGION=us-east-1
      # - AWS_SESSION_TOKEN=your_session_token_here  # For temporary credentials (ASIA*)

      # Azure Cognitive Services (for mod_azure_transcribe)
      # - AZURE_SUBSCRIPTION_KEY=your_azure_key_here
      # - AZURE_REGION=eastus

      # Google Cloud (for mod_google_transcribe)
      # - GOOGLE_APPLICATION_CREDENTIALS=/etc/google/credentials.json

      # FreeSWITCH logging
      - FREESWITCH_LOG_LEVEL=INFO

      # mod_audio_fork settings (optional)
      # Buffer size in seconds (default: 2, min: 1, max: 5)
      # Controls audio buffering before sending to WebSocket
      - MOD_AUDIO_FORK_BUFFER_SECS=2

      # Number of libwebsocket service threads (default: 1, min: 1, max: 5)
      # These threads handle sending messages for all sessions
      - MOD_AUDIO_FORK_SERVICE_THREADS=1

      # WebSocket sub-protocol name (default: "audio.drachtio.org")
      # - MOD_AUDIO_FORK_SUBPROTOCOL_NAME=audio.drachtio.org

    # Volume mounts for persistence and configuration
    volumes:
      # Logs
      - ./logs:/usr/local/freeswitch/log

      # Google Cloud credentials (uncomment and set path if using mod_google_transcribe)
      # - /path/to/your/google-credentials.json:/etc/google/credentials.json:ro

      # Configuration (optional - uncomment to customize)
      # - ./config/freeswitch.xml:/usr/local/freeswitch/conf/freeswitch.xml:ro
      # - ./config/dialplan:/usr/local/freeswitch/conf/dialplan:ro
      # - ./config/directory:/usr/local/freeswitch/conf/directory:ro

      # Recordings (optional)
      # - ./recordings:/usr/local/freeswitch/recordings

    # Restart policy
    restart: unless-stopped

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

    # Health check
    healthcheck:
      test: ["CMD", "/usr/local/freeswitch/bin/fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Network mode
    network_mode: bridge

# Optional: Add a network for multiple services
networks:
  default:
    name: freeswitch-network
    driver: bridge

# Optional: Named volumes for persistence
volumes:
  freeswitch-logs:
    driver: local
  freeswitch-recordings:
    driver: local
