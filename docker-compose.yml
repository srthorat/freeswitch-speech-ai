version: '3.8'

services:
  freeswitch-speech-ai:
    image: freeswitch-speech-ai:latest
    container_name: freeswitch-speech-ai
    hostname: freeswitch

    # Build configuration (optional - use pre-built image or build locally)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CPUS: 4
        AWS_SDK_CPP_VERSION: 1.11.345
        LIBWEBSOCKETS_VERSION: 4.3.3
        GOOGLE_CLOUD_CPP_VERSION: 2.30.0

    # Network ports
    ports:
      # SIP
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "5080:5080/tcp"
      - "5080:5080/udp"
      # Event Socket (fs_cli)
      - "8021:8021/tcp"
      # RTP media
      - "16384-16484:16384-16484/udp"

    # Environment variables for all transcription services
    # Mirrors /etc/systemd/system/freeswitch.service.d/freeswitch.conf
    environment:
      # Library Path (required for modules)
      - LD_LIBRARY_PATH=/usr/local/lib

      # Google Cloud Configuration (for mod_google_transcribev2)
      # Uncomment and set your values:
      # - GOOGLE_APPLICATION_CREDENTIALS=/etc/google/credentials.json
      # - GCP_PROJECT_ID=your-project-id
      # - GCP_LOCATION=us-central1

      # AWS Configuration (for mod_aws_transcribe)
      # Uncomment and set your values:
      # - AWS_ACCESS_KEY_ID=your-access-key
      # - AWS_SECRET_ACCESS_KEY=your-secret-key
      # - AWS_DEFAULT_REGION=us-east-1

      # Deepgram Configuration (for mod_deepgram_transcribe)
      # Uncomment and set your values:
      # - DEEPGRAM_API_KEY=your-deepgram-api-key

      # Pusher Configuration (for real-time transcript delivery)
      # Uncomment and set your values:
      # - PUSHER_APP_ID=your-app-id
      # - PUSHER_KEY=your-key
      # - PUSHER_SECRET=your-secret
      # - PUSHER_CLUSTER=us2

      # Audio Processing Configuration
      # Uncomment and adjust as needed:
      # - MOD_AUDIO_FORK_BUFFER_SECS=3
      # - MOD_AUDIO_FORK_SERVICE_THREADS=2

      # FreeSWITCH logging
      - FREESWITCH_LOG_LEVEL=INFO

    # Volume mounts for persistence and configuration
    volumes:
      # Logs
      - ./logs:/usr/local/freeswitch/log

      # Google Cloud credentials (uncomment and set path if using mod_google_transcribev2)
      # - /path/to/your/google-credentials.json:/etc/google/credentials.json:ro

      # Configuration (optional - uncomment to customize)
      # - ./config/freeswitch.xml:/usr/local/freeswitch/conf/freeswitch.xml:ro
      # - ./config/dialplan:/usr/local/freeswitch/conf/dialplan:ro
      # - ./config/directory:/usr/local/freeswitch/conf/directory:ro

      # Recordings (optional)
      # - ./recordings:/usr/local/freeswitch/recordings

    # Restart policy
    restart: unless-stopped

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

    # Health check
    healthcheck:
      test: ["CMD", "/usr/local/freeswitch/bin/fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Network mode
    network_mode: bridge

# Optional: Add a network for multiple services
networks:
  default:
    name: freeswitch-network
    driver: bridge

# Optional: Named volumes for persistence
volumes:
  freeswitch-logs:
    driver: local
  freeswitch-recordings:
    driver: local
