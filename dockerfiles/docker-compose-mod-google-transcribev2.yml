# ============================================================================
# Docker Compose for FreeSWITCH with mod_google_transcribev2
# ============================================================================
#
# This docker-compose file demonstrates how to run FreeSWITCH with
# mod_google_transcribev2 and properly configure Google Cloud credentials.
#
# Prerequisites:
#   1. Build the Docker image first:
#      docker build -f dockerfiles/Dockerfile.mod_google_transcribev2 \
#        -t freeswitch:mod-google-transcribev2 .
#
#   2. Create a Google Cloud service account and download credentials JSON:
#      - Go to GCP Console > IAM & Admin > Service Accounts
#      - Create service account with "Cloud Speech-to-Text API User" role
#      - Create and download JSON key
#      - Save as: ./secrets/google-creds.json
#
#   3. Update the environment variables below with your GCP project ID
#
# Usage:
#   docker-compose -f dockerfiles/docker-compose-mod-google-transcribev2.yml up
#
# Access:
#   - SIP: sip:1000@<host>:5060 (password: 1234)
#   - fs_cli: docker exec -it freeswitch-google fs_cli
#   - Logs: docker logs -f freeswitch-google
#
# ============================================================================

version: '3.8'

services:
  freeswitch-google:
    image: freeswitch:mod-google-transcribev2
    container_name: freeswitch-google
    hostname: freeswitch-google

    # Network mode: host for easier SIP/RTP handling
    # Alternative: bridge mode with port mapping (see commented section below)
    network_mode: host

    # Restart policy
    restart: unless-stopped

    # Environment variables
    environment:
      # ======================================================================
      # Google Cloud Configuration (REQUIRED)
      # ======================================================================
      # Path to service account credentials JSON file (mounted via volume)
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/freeswitch/google-creds.json

      # Your Google Cloud Project ID
      # IMPORTANT: Replace with your actual GCP project ID
      - GOOGLE_PROJECT_ID=your-gcp-project-id

      # GCP region for Speech-to-Text API
      # Common values: us-central1, us-east1, europe-west1, asia-southeast1
      - GCP_LOCATION=us-central1

      # ======================================================================
      # Library Path (REQUIRED for modules)
      # ======================================================================
      - LD_LIBRARY_PATH=/usr/local/lib:/usr/local/freeswitch/lib

      # ======================================================================
      # Optional: FreeSWITCH Configuration
      # ======================================================================
      # Uncomment to enable debug logging
      # - FREESWITCH_LOG_LEVEL=DEBUG

      # ======================================================================
      # Optional: Pusher Configuration (for real-time transcript delivery)
      # ======================================================================
      # Uncomment and configure if using Pusher for transcript webhooks
      # - PUSHER_APP_ID=your-app-id
      # - PUSHER_KEY=your-key
      # - PUSHER_SECRET=your-secret
      # - PUSHER_CLUSTER=us2

    # Volume mounts
    volumes:
      # ======================================================================
      # Google Cloud Credentials (REQUIRED)
      # ======================================================================
      # Mount your Google Cloud service account credentials JSON file
      # IMPORTANT: Update the path to your actual credentials file
      - ./secrets/google-creds.json:/etc/freeswitch/google-creds.json:ro

      # ======================================================================
      # FreeSWITCH Configuration (Optional)
      # ======================================================================
      # Uncomment to override default configuration
      # - ./conf:/usr/local/freeswitch/conf

      # ======================================================================
      # Logs and Database (Optional - for persistence)
      # ======================================================================
      # Uncomment to persist logs and database
      # - ./freeswitch-logs:/usr/local/freeswitch/log
      # - ./freeswitch-db:/usr/local/freeswitch/db

    # Capabilities (if running with user restrictions)
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE

    # Health check
    healthcheck:
      test: ["CMD", "/usr/local/freeswitch/bin/fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# Alternative: Bridge Network Mode with Port Mapping
# ============================================================================
# Uncomment this section if you prefer bridge networking instead of host mode
#
# networks:
#   freeswitch-net:
#     driver: bridge
#
# services:
#   freeswitch-google:
#     networks:
#       - freeswitch-net
#     ports:
#       # SIP signaling
#       - "5060:5060/tcp"
#       - "5060:5060/udp"
#       - "5080:5080/tcp"
#       - "5080:5080/udp"
#       # SIP TLS
#       - "5061:5061/tcp"
#       - "5061:5061/udp"
#       - "5081:5081/tcp"
#       - "5081:5081/udp"
#       # Event Socket (fs_cli)
#       - "8021:8021/tcp"
#       # WebRTC
#       - "7443:7443/tcp"
#       # RTP Media (adjust range as needed)
#       - "16384-16484:16384-16484/udp"
#
# ============================================================================

# ============================================================================
# Secrets Management (Alternative to volume mount)
# ============================================================================
# For production, consider using Docker secrets instead of volume mounts:
#
# secrets:
#   google_creds:
#     file: ./secrets/google-creds.json
#
# services:
#   freeswitch-google:
#     secrets:
#       - google_creds
#     environment:
#       - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google_creds
#
# ============================================================================

# ============================================================================
# Environment Variables Override (Alternative)
# ============================================================================
# You can also use a .env file to manage environment variables:
#
# Create a file named ".env" in the same directory:
#
# GOOGLE_PROJECT_ID=my-actual-project-id
# GCP_LOCATION=us-central1
# PUSHER_APP_ID=123456
# PUSHER_KEY=abc123
# PUSHER_SECRET=xyz789
# PUSHER_CLUSTER=us2
#
# Then remove the hard-coded values from the environment section above
# ============================================================================
